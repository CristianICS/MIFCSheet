name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Show Node version
        run: node --version

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage